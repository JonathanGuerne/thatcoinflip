<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>That Coin Flip Tho</title>
    <link rel="icon" href="pile.png">

    <style>
        body {
            background: #1c1c1c;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            transform: perspective(2000px);
            -webkit-transform: perspective(2000px);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .coin {
            height: min(70vw, 70vh);
            width: min(70vw, 70vh);
            background-image: url("./face.png");
            background-size: cover;
            margin-bottom: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .coin.flip {
            transition: 3s;
            transform: rotate3d(1, 0.5, 0, 720deg);
        }

        .coin.toss {
            -webkit-animation: toss 3s forwards ease-in-out;
            animation: toss 3s forwards ease-in-out;
        }

        .coin:hover {
            cursor: pointer;
        }

        @-webkit-keyframes toss {
            0% {
                top: 0px;
            }

            50% {
                top: -50vh;
            }

            100% {
                top: 0px;
            }
        }

        @keyframes toss {
            0% {
                top: 0px;
            }

            50% {
                top: -50vh;
            }

            100% {
                top: 0px;
            }
        }
    </style>
</head>

<body translate="no">
    <div class="coin"></div>

    <script id="rendered-js">
        var coinFlipButton = document.getElementById("coinFlipButton");
        var coin = document.querySelector(".coin");

        coin.addEventListener("click", function () {
            // generate a fair random number between 0 and 1
            var randomNumber = Math.random();

            coin.classList.add("flip");
            coin.classList.add("toss");

            setTimeout(function () {
                if (randomNumber < 0.5) {
                    coin.style.backgroundImage = "url('./face.png')";
                } else if (randomNumber >= 0.5) {
                    coin.style.backgroundImage = "url('./pile.png')";
                }
            }, 1500);

            setTimeout(function () {
                coin.classList.remove("toss");
                coin.classList.remove("flip");
            }, 3000);
        });
    </script>
</body>
